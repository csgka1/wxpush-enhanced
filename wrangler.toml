name = "wxpush"
main = "./src/index.tsx"
compatibility_date = "2026-10-01"
compatibility_flags = [
    "remove_nodejs_compat_eol_v24"  # remove after 2028-04-30
]

[assets]
directory = "./public"

[triggers]
crons = ["0 2 * * *"]

[observability.logs]
enabled = true
invocation_logs = true


# preview configs

[previews.observability.traces]
enabled = true
head_sampling_rate = 0.05
